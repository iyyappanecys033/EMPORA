# EMPORA MySQL Production Profile Configuration
# EMPORA - Employee Services & Workflow Platform
# One platform. Connected operations.

# [A04: Cryptographic Failures] TLS 1.2/1.3 Enforcement for Spring Boot to MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:empora_db}?useSSL=true&requireSSL=true&verifyServerCertificate=${DB_VERIFY_CERT:false}&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USERNAME:empora_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Signing Key (MUST be supplied via environment variable in MySQL/staging/production profiles)
jwt.secret=${JWT_SECRET}

# [A04: Cryptographic Failures] External Encryption Key for AES-256-GCM PII Fields
empora.security.encryption-key=${EMPORA_ENCRYPTION_KEY}

# JPA / Hibernate settings for MySQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Production Migration Governance
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing IAM Schema Baseline
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# [A02: Security Misconfiguration] Stack Trace Suppression & Error Hardening
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# [A02: Security Misconfiguration] Actuator Endpoint Lockdown
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=false

# H2 Console strictly disabled in MySQL profile
spring.h2.console.enabled=false

# Explicitly prohibit destructive audit chain reset in production
epams.audit.allow-chain-reset=false

# Production Cookie Security (Secure=true by default in production)
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Scheduled SLA & Auto-Closure Processing
epams.scheduling.enabled=${EPAMS_SCHEDULING_ENABLED:true}

# Optional External SMTP Email Adapter
epams.email.enabled=${EPAMS_EMAIL_ENABLED:false}
epams.email.host=${EPAMS_EMAIL_HOST:localhost}
epams.email.port=${EPAMS_EMAIL_PORT:1025}
epams.email.from=${EPAMS_EMAIL_FROM:no-reply@empora.local}
epams.email.username=${EPAMS_EMAIL_USERNAME:}
epams.email.password=${EPAMS_EMAIL_PASSWORD:}

# Multi-year externalized corporate holiday dates
epams.calendar.holidays=${EPAMS_HOLIDAYS:}
epams.calendar.include-default-2026=${EPAMS_INCLUDE_DEFAULT_2026:true}
