# EMPORA - Employee Services & Workflow Platform
# One platform. Connected operations.
spring.application.name=EMPORA

# H2 Database for local development/testing
spring.datasource.url=jdbc:h2:mem:springboot_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# [A02: Security Misconfiguration] Disable Whitelabel error pages and suppress stack traces
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# [A02: Security Misconfiguration] Actuator Endpoint Lockdown
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=false

# H2 Console (disabled by default in production)
spring.h2.console.enabled=false

# JWT Settings
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Cookie Settings
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
