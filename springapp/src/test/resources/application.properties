spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=testuser
spring.datasource.password=testpassword
spring.datasource.driver-class-name=org.h2.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# Hibernate schema validation against Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Cookie Settings
app.security.cookie.secure=false
app.security.cookie.same-site=Lax

# Test-only flag permitting audit chain reset during automated test isolation
epams.audit.allow-chain-reset=true

# Disable background cron threads & external SMTP during tests (invoked deterministically in tests)
epams.scheduling.enabled=false
epams.email.enabled=false
