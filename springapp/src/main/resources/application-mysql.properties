# MySQL Production Profile Configuration for EPAMS
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:epams_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:epams_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Signing Key (MUST be supplied via environment variable in MySQL/staging/production profiles)
jwt.secret=${JWT_SECRET}

# JPA / Hibernate settings for MySQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Production Migration Governance
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing IAM Schema Baseline
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# H2 Console disabled in MySQL profile
spring.h2.console.enabled=false

# Explicitly prohibit destructive audit chain reset in production
epams.audit.allow-chain-reset=false

# Production Cookie Security (Secure=true by default; override COOKIE_SECURE=false only for local HTTP staging)
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Scheduled SLA & Auto-Closure Processing
epams.scheduling.enabled=${EPAMS_SCHEDULING_ENABLED:true}

# Optional External SMTP Email Adapter (disabled by default; supply via env vars in P10/staging)
epams.email.enabled=${EPAMS_EMAIL_ENABLED:false}
epams.email.host=${EPAMS_EMAIL_HOST:localhost}
epams.email.port=${EPAMS_EMAIL_PORT:1025}
epams.email.from=${EPAMS_EMAIL_FROM:no-reply@epams.local}
epams.email.username=${EPAMS_EMAIL_USERNAME:}
epams.email.password=${EPAMS_EMAIL_PASSWORD:}

# Multi-year externalized corporate holiday dates (comma-separated YYYY-MM-DD, e.g., 2027-01-26,2027-08-15)
epams.calendar.holidays=${EPAMS_HOLIDAYS:}
epams.calendar.include-default-2026=${EPAMS_INCLUDE_DEFAULT_2026:true}
