
# H2 Database for development
spring.datasource.url=jdbc:h2:mem:springboot_db
spring.datasource.username=123
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (for development)
spring.h2.console.enabled=true
# Default security password removed for JWT stateless application

# JWT Settings
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Cookie Settings
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
